name: iinatan mpv companion

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Check dependency freshness and vulnerabilities
        shell: bash
        run: |
          test "$(npm outdated --json)" = "{}"
          npm audit --omit=optional --audit-level=moderate
      - run: npm run format:check
      - run: npm test
      - run: npm run test:anki
      - run: npm run validate:release

  browser-integration:
    name: Linux Electron/browser integration (Xvfb)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install virtual X11 display and window manager
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends xauth libnspr4 libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libgtk-3-0t64 libasound2t64 libcups2t64 libgbm1 libxcomposite1 libxdamage1 libxrandr2 libxfixes3 libxkbcommon0 libxshmfence1 xvfb openbox
      - run: npm ci
      - name: Materialize Electron runtime
        run: node -e "require('electron')"
      - name: Prepare Electron Chromium sandbox helper
        run: |
          if test -f node_modules/electron/dist/chrome-sandbox; then
            sudo chown root:root node_modules/electron/dist/chrome-sandbox
            sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          fi
      - name: Run overlay document integration
        run: xvfb-run --auto-servernum --server-args="-screen 0 1600x1000x24" npm run test:browser
      - name: Run settings document integration
        run: xvfb-run --auto-servernum --server-args="-screen 0 1600x1000x24" npm run test:settings

  linux-x11-native-probe:
    name: Linux X11 native probe
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install X11 build and display dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends xauth libnspr4 libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libgtk-3-0t64 libasound2t64 libcups2t64 libgbm1 libxcomposite1 libxdamage1 libxrandr2 libxfixes3 libxkbcommon0 libxshmfence1 libx11-dev libxtst-dev xvfb openbox
      - run: npm ci
      - name: Materialize Electron runtime
        run: node -e "require('electron')"
      - name: Prepare Electron Chromium sandbox helper
        run: |
          if test -f node_modules/electron/dist/chrome-sandbox; then
            sudo chown root:root node_modules/electron/dist/chrome-sandbox
            sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          fi
      - name: Configure native helper
        run: cmake --preset release
      - name: Build X11 window probe
        run: cmake --build build/native --target iinatan-window-probe
      - name: Build X11 desktop input and capture helper
        run: cmake --build build/native --target iinatan-desktop-test
      - name: Exercise native X11 window identity, geometry, and activation
        env:
          IINATAN_X11_REQUIRED: "1"
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1600x1000x24" \
            sh -c 'openbox --sm-disable >/tmp/iinatan-openbox.log 2>&1 & sleep 1; exec npm run test:native:x11'
      - name: Exercise native X11 Electron text selection
        env:
          IINATAN_NATIVE_SELECTION: "1"
          IINATAN_NATIVE_SELECTION_OVERLAY: "1"
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1600x1000x24" \
            sh -c 'openbox --sm-disable >/tmp/iinatan-openbox-selection.log 2>&1 & sleep 1; exec npm run test:native:selection'

  windows-native-probe:
    name: Windows native window probe
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Configure native helper
        run: cmake -S . -B build/native -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build Win32 window probe
        run: cmake --build build/native --config Release --target iinatan-window-probe
      - name: Build Win32 desktop input and capture helper
        run: cmake --build build/native --config Release --target iinatan-desktop-test
      - name: Exercise native HWND identity, client geometry, DPI, activation, and resize
        env:
          IINATAN_WINDOWS_REQUIRED: "1"
        run: npm run test:native:windows
      - name: Exercise native Win32 Electron text selection
        env:
          IINATAN_NATIVE_SELECTION: "1"
          IINATAN_NATIVE_SELECTION_OVERLAY: "1"
        run: npm run test:native:selection

  linux-stock-mpv-native-e2e:
    name: Linux X11 stock-mpv native E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install stock mpv, encoder, X11, and virtual display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg mpv xauth libnspr4 libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libgtk-3-0t64 libasound2t64 libcups2t64 libgbm1 libxcomposite1 libxdamage1 libxrandr2 libxfixes3 libxkbcommon0 libxshmfence1 libx11-dev libxtst-dev xvfb openbox
      - run: npm ci
      - name: Materialize Electron runtime
        run: node -e "require('electron')"
      - name: Prepare Electron Chromium sandbox helper
        run: |
          if test -f node_modules/electron/dist/chrome-sandbox; then
            sudo chown root:root node_modules/electron/dist/chrome-sandbox
            sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          fi
      - name: Configure native helpers
        run: cmake --preset release
      - name: Build native helpers
        run: cmake --build build/native --config Release
      - name: Run stock-mpv, transparent Electron, native input, and combined-capture E2E
        env:
          IINATAN_E2E: "1"
          IINATAN_E2E_ALLOW_APPROXIMATE: "1"
          IINATAN_E2E_NATIVE_INTERACTION: "1"
          IINATAN_E2E_VO: "x11"
          IINATAN_E2E_DEBUG: "1"
          IINATAN_E2E_EVIDENCE_DIR: ${{ runner.temp }}/iinatan-linux-native-e2e
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1600x1000x24" \
            sh -c 'openbox --sm-disable >/tmp/iinatan-openbox-e2e.log 2>&1 & sleep 1; exec npm run test:e2e'
      - name: Upload Linux native E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iinatan-linux-stock-mpv-native-e2e
          path: ${{ runner.temp }}/iinatan-linux-native-e2e
          if-no-files-found: warn

  windows-stock-mpv-native-e2e:
    name: Windows stock-mpv native E2E
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install stock mpv and encoder
        shell: pwsh
        run: choco install mpv ffmpeg -y --no-progress
      - name: Verify stock mpv and encoder are on PATH
        shell: pwsh
        run: |
          Get-Command mpv
          Get-Command ffmpeg
      - run: npm ci
      - name: Configure native helpers
        run: cmake -S . -B build/native -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build native helpers
        run: cmake --build build/native --config Release
      - name: Run stock-mpv, transparent Electron, native input, and combined-capture E2E
        env:
          IINATAN_E2E: "1"
          IINATAN_E2E_ALLOW_APPROXIMATE: "1"
          IINATAN_E2E_NATIVE_INTERACTION: "1"
          IINATAN_E2E_DEBUG: "1"
          IINATAN_E2E_EVIDENCE_DIR: ${{ runner.temp }}\iinatan-windows-native-e2e
        run: npm run test:e2e
      - name: Upload Windows native E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iinatan-windows-stock-mpv-native-e2e
          path: ${{ runner.temp }}\iinatan-windows-native-e2e
          if-no-files-found: warn

  native:
    name: Native helper (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            preset: release
          - os: ubuntu-24.04
            preset: release
          - os: windows-2025
            preset: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install X11 development headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libx11-dev libxtst-dev
      - name: Configure native helper (Unix)
        if: runner.os != 'Windows'
        run: cmake --preset ${{ matrix.preset }}
      - name: Configure native helper (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build/native -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build native helper
        run: cmake --build build/native --config Release
      - name: Check executable exists
        shell: bash
        run: test -f build/native/iinatan-window-probe || test -f build/native/Release/iinatan-window-probe.exe
      - name: Check macOS mpv content shim exists
        if: runner.os == 'macOS'
        shell: bash
        run: test -f build/native/iinatan-mpv-window-shim.so
      - name: Check portable dictionary helper exists
        if: runner.os != 'macOS'
        shell: bash
        run: test -f build/native/iina-hoshi-dicts || test -f build/native/Release/iina-hoshi-dicts.exe
      - name: Exercise portable dictionary worker
        if: runner.os != 'macOS'
        shell: bash
        env:
          IINATAN_PORTABLE_HOSHI_REQUIRED: "1"
        run: node scripts/e2e/portable-hoshi-smoke.js

  package-directory:
    name: Directory package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2025
            platform: win32
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Install X11 development headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake ninja-build p7zip-full \
            libfontconfig1-dev libexpat1-dev libx11-dev libxtst-dev
      - name: Install Windows portable geometry toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install mingw ninja 7zip -y --no-progress
      - name: Build portable geometry dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          IINATAN_NATIVE_JOBS: "2"
          IINATAN_CMAKE_GENERATOR: Ninja
          IINATAN_FONTCONFIG_ROOT: /
          IINATAN_EXPAT_ROOT: /
        run: ./scripts/build-native-geometry.sh linux-x86_64
      - name: Build portable geometry dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          IINATAN_NATIVE_JOBS: "2"
          IINATAN_CMAKE_GENERATOR: Ninja
        run: ./scripts/build-native-geometry.sh windows-x86_64
      - name: Build Windows libass compatibility dependencies
        if: runner.os == 'Windows'
        shell: bash
        env:
          IINATAN_NATIVE_BUILD_ROOT: build/native-geometry-windows-compat
          IINATAN_NATIVE_JOBS: "2"
          IINATAN_CMAKE_GENERATOR: Ninja
          IINATAN_LIBASS_PROFILE: windows-mpv-0.41.0-libass-0.17.4-external-subrip
        run: ./scripts/build-native-geometry.sh windows-x86_64
      - name: Configure portable geometry helper (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          PKG_CONFIG_PATH: build/native-geometry-linux-x86_64/stage/lib/pkgconfig
        run: |
          cmake -S . -B build/native-geometry-linux-x86_64-cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DIINATAN_BUILD_DESKTOP_TEST=OFF \
            -DIINATAN_BUILD_PORTABLE_HOSHI=OFF \
            -DIINATAN_BUILD_PORTABLE_GEOMETRY=ON \
            -DIINATAN_NATIVE_GEOMETRY_STAGE=build/native-geometry-linux-x86_64/stage \
            -DCMAKE_PREFIX_PATH=build/native-geometry-linux-x86_64/stage \
            -DPKG_CONFIG_EXECUTABLE=build/native-geometry-linux-x86_64/tools/bin/pkgconf
          cmake --build build/native-geometry-linux-x86_64-cmake --config Release --target iinatan-native-geometry
      - name: Configure portable geometry helper (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake -S . -B build/native-geometry-windows-x86_64-cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DIINATAN_BUILD_DESKTOP_TEST=OFF \
            -DIINATAN_BUILD_PORTABLE_HOSHI=OFF \
            -DIINATAN_BUILD_PORTABLE_GEOMETRY=ON \
            -DIINATAN_NATIVE_GEOMETRY_STAGE=build/native-geometry-windows-x86_64/stage \
            -DCMAKE_PREFIX_PATH=build/native-geometry-windows-x86_64/stage
          cmake --build build/native-geometry-windows-x86_64-cmake --config Release --target iinatan-native-geometry
      - name: Configure Windows libass compatibility helper
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake -S . -B build/native-geometry-windows-compat-cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DIINATAN_BUILD_DESKTOP_TEST=OFF \
            -DIINATAN_BUILD_PORTABLE_HOSHI=OFF \
            -DIINATAN_BUILD_PORTABLE_GEOMETRY=ON \
            -DIINATAN_ASS_GEOMETRY_PATCH=libass-0.17.4-iinatan-unit-ids-v2 \
            -DIINATAN_NATIVE_GEOMETRY_STAGE=build/native-geometry-windows-compat/stage \
            -DCMAKE_PREFIX_PATH=build/native-geometry-windows-compat/stage
          cmake --build build/native-geometry-windows-compat-cmake --config Release --target iinatan-native-geometry
      - name: Exercise portable geometry helper (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          IINATAN_NATIVE_GEOMETRY: build/native-geometry-linux-x86_64-cmake/Release/iinatan-native-geometry
          IINATAN_NATIVE_GEOMETRY_REQUIRED: "1"
        run: node scripts/e2e/native-geometry-smoke.js
      - name: Exercise portable geometry helper (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          IINATAN_NATIVE_GEOMETRY: build/native-geometry-windows-x86_64-cmake/Release/iinatan-native-geometry.exe
          IINATAN_NATIVE_GEOMETRY_REQUIRED: "1"
        run: node scripts/e2e/native-geometry-smoke.js
      - name: Configure native helper (Unix)
        if: runner.os != 'Windows'
        run: cmake --preset release
      - name: Configure native helper (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build/native -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build native helper
        run: cmake --build build/native --config Release
      - run: npm run package
        env:
          IINATAN_NATIVE_GEOMETRY_COMPAT: ${{ matrix.platform == 'win32' && 'build/native-geometry-windows-compat-cmake/Release/iinatan-native-geometry.exe' || '' }}
      - name: Validate directory package
        env:
          IINATAN_PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: npm run validate:package
      - name: Record Linux build baseline
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "runner=${RUNNER_OS}"
          echo "architecture=$(uname -m)"
          ldd --version | head -n 1
      - name: Upload macOS directory package
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: iinatan-directory-darwin-arm64
          path: dist/mac-arm64/iinatan for mpv.app
          if-no-files-found: error
      - name: Upload Windows directory package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: iinatan-directory-win32-x64
          path: dist/win-unpacked
          if-no-files-found: error
      - name: Upload Linux directory package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: iinatan-directory-linux-x64-ubuntu-24.04
          path: dist/linux-unpacked
          if-no-files-found: error
      - name: Upload macOS distributables
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: iinatan-installers-darwin-arm64
          path: |
            dist/*.dmg
            dist/*-mac.zip
            dist/*.blockmap
            dist/latest-mac.yml
          if-no-files-found: error
      - name: Upload Windows distributables
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: iinatan-installers-win32-x64
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
      - name: Upload Linux distributables
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: iinatan-installers-linux-x64-ubuntu-24.04
          path: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.blockmap
            dist/latest-linux.yml
          if-no-files-found: error

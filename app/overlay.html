<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src https: http://127.0.0.1 http://localhost; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="color-scheme" content="dark light" />
    <title>iinatan</title>
    <link rel="stylesheet" href="./overlay.css" />
  </head>
  <body>
    <div id="root" data-surface="highlight">
      <div id="status" class="hidden"></div>
      <div id="bitmap-ocr-status" class="hidden" role="status" aria-live="polite"></div>
      <div id="task" class="hidden" data-clickable="true"></div>
      <div id="subtitle" class="hidden"></div>
      <div id="highlight-layer" aria-hidden="true"></div>
      <div
        id="popup"
        class="lookup-popup hidden"
        data-clickable="true"
        data-popup-depth="0"
        role="dialog"
        aria-label="Dictionary lookup"
        tabindex="-1"
      ></div>
      <div id="nested-popup-layer" aria-live="polite"></div>
      <div
        id="popup-safety-zone"
        class="hidden"
        data-clickable="true"
        aria-hidden="true"
      ></div>
      <div
        id="popup-row-safety-zone"
        class="hidden"
        data-clickable="true"
        aria-hidden="true"
      ></div>
      <div id="controller-hold-progress" class="hidden" aria-hidden="true">
        <svg viewBox="0 0 40 40" focusable="false" aria-hidden="true">
          <circle class="controller-hold-track" cx="20" cy="20" r="16"></circle>
          <circle class="controller-hold-fill" cx="20" cy="20" r="16"></circle>
        </svg>
      </div>
    </div>
    <script src="./renderer.js"></script>
  </body>
</html>
